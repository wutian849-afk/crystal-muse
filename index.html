<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Muse — Healing Crystal Bracelets</title>
  <meta name="description" content="Handcrafted crystal bracelets for healing, energy, and intention.">
  <meta http-equiv="refresh" content="0;url=store/index.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>💎</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .redirect-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--purple-deep), #1a0f2e);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .redirect-card {
      max-width: 400px;
    }
    .redirect-card h1 {
      font-family: var(--font-heading);
      font-size: 2.5rem;
      color: var(--white);
      margin-bottom: 10px;
    }
    .redirect-card h1 span { color: var(--gold-primary); }
    .redirect-card p { color: rgba(255,255,255,0.7); margin-bottom: 30px; }
    .redirect-card a {
      display: inline-block;
      padding: 14px 36px;
      background: var(--gold-primary);
      color: var(--purple-deep);
      border-radius: 50px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .redirect-card a:hover { background: var(--gold-light); transform: translateY(-2px); }
    .redirect-links { margin-top: 20px; font-size: 0.85rem; }
    .redirect-links a { display: inline-block; padding: 8px 16px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border-radius: 6px; margin: 0 6px; transition: all 0.3s ease; }
    .redirect-links a:hover { background: rgba(255,255,255,0.2); color: white; }
  </style>
</head>
<body>
  <div class="redirect-page">
    <div class="redirect-card">
      <h1>Crystal <span>Muse</span></h1>
      <p>Handcrafted healing crystal bracelets</p>
      <a href="store/index.html">Enter the Store ✨</a>
      <div class="redirect-links">
        <a href="admin/index.html">Admin</a>
        <a href="checkout.html">Checkout</a>
      </div>
    </div>
  </div>
</body>
</html>
