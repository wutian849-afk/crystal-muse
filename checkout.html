<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Crystal Muse</title>
  <meta name="description" content="Complete your crystal bracelet purchase">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>💎</text></svg>">
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <a href="../store/index.html" class="logo">Crystal <span>Muse</span></a>
      <ul class="nav-links">
        <li><a href="../store/index.html#products">Shop</a></li>
        <li><a href="../store/index.html#about">About</a></li>
        <li style="color:var(--gray-400);font-size:0.95rem;">Checkout</li>
      </ul>
    </div>
  </header>

  <!-- CHECKOUT -->
  <section class="checkout-page">
    <div class="checkout-grid">
      <div class="checkout-form">
        <h2>Shipping Information</h2>
        <form id="checkoutForm" onsubmit="return false;">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" required placeholder="Jane">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" required placeholder="Doe">
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="jane@example.com">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+1 (555) 123-4567">
          </div>
          <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" required placeholder="123 Crystal Lane">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" required placeholder="Sedona">
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" required placeholder="AZ">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="zip">ZIP Code</label>
              <input type="text" id="zip" required placeholder="86336">
            </div>
            <div class="form-group">
              <label for="country">Country</label>
              <input type="text" id="country" required placeholder="United States">
            </div>
          </div>
        </form>
      </div>

      <div class="checkout-summary">
        <h2>Order Summary</h2>
        <div class="checkout-summary-card">
          <div class="checkout-summary-items" id="checkoutItems"></div>
          <div class="checkout-total" id="checkoutTotal">
            <span>Total</span>
            <span>$0.00</span>
          </div>
          <div id="paypal-button-container" style="margin-top:20px;"></div>
          <p style="text-align:center;font-size:0.8rem;color:var(--gray-400);margin-top:12px;">
            Secure checkout powered by PayPal
          </p>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER (minimal) -->
  <footer class="site-footer" style="padding:30px 20px;">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding:0;">
        <p>&copy; 2026 Crystal Muse. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="../js/store.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD" data-namespace="paypal_sdk"></script>
  <script>
    // Override: we're on checkout page
    document.addEventListener('DOMContentLoaded', function() {
      initCheckoutPage();
    });
  </script>
</body>
</html>
